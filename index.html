<div class="advanced-wa-container">
    <div class="wa-header">
        <br /><h3>Click to Chat Linker</h3>
        <p>Create chat links with worldwide country codes &amp; QR codes</p>
    </div>
    
    <div class="wa-body">
        <!--1. Country Code & Phone-->
        <div class="wa-form-group">
            <label>1. WhatsApp Number</label>
            <div class="phone-input-row">
                <select id="countryCode" onchange="checkManualCode(this)">
                    <option value="91">🇮🇳 +91 (India)</option>
                    <option value="1">🇺🇸 +1 (USA/Canada)</option>
                    <option value="44">🇬🇧 +44 (United Kingdom)</option>
                    <option value="971">🇦🇪 +971 (UAE)</option>
                    <option value="966">🇸🇦 +966 (Saudi Arabia)</option>
                    <option value="65">🇸🇬 +65 (Singapore)</option>
                    <option value="60">🇲🇾 +60 (Malaysia)</option>
                    <option value="61">🇦🇺 +61 (Australia)</option>
                    <option value="49">🇩🇪 +49 (Germany)</option>
                    <option value="33">🇫🇷 +33 (France)</option>
                    <option value="81">🇯🇵 +81 (Japan)</option>
                    <option value="86">🇨🇳 +86 (China)</option>
                    <option value="55">🇧🇷 +55 (Brazil)</option>
                    <option value="27">🇿🇦 +27 (South Africa)</option>
                    <option value="92">🇵🇰 +92 (Pakistan)</option>
                    <option value="880">🇧🇩 +880 (Bangladesh)</option>
                    <option value="94">🇱🇰 +94 (Sri Lanka)</option>
                    <option value="977">🇳🇵 +977 (Nepal)</option>
                    <option value="other">✍️ Other (Manual Entry)</option>
                </select>
                
                <input id="manualCode" maxlength="5" style="display: none;" type="text" />
                
                <input id="waPhone" type="text" />
            </div>
        </div>

        <!--2. Pre-made Message Templates-->
        <div class="wa-form-group">
            <label>2. Quick Message Templates</label>
            <select id="templateSelector">
                <option value="">-- Select a template (Optional) --</option>
                <option value="Hi, I am interested in your products/services. Please share more details.">General Inquiry</option>
                <option value="Hello, I want to know the price and availability of this item.">Price Inquiry</option>
                <option value="Hi, I need technical support regarding your services.">Technical Support</option>
                <option value="Hello, I want to place an order. Please guide me.">Order Placement</option>
            </select>
        </div>

        <!--3. Custom Message Box-->
        <div class="wa-form-group">
            <label>3. Custom Message</label>
            <textarea id="waMessage"></textarea>
        </div>

        <button id="waGenerateBtn">Generate Link &amp; QR Code</button>

        <!--Result Section-->
        <div class="wa-result-box" id="waResultBox" style="display: none;">
            <label>Your WhatsApp Link</label>
            <input id="waOutputLink" readonly="" type="text" />
            <div class="wa-btn-row">
                <button id="waCopyBtn">Copy Link</button>
                <a href="" id="waTestBtn" target="_blank">Test Link</a>
            </div>
            
            <!--QR Code Display Area-->
            <div class="qr-container" style="margin-top: 15px; text-align: center;">
                <label style="display: block; margin-bottom: 5px;">Scan QR Code</label>
                <img alt="WhatsApp QR Code" id="qrImage" src="" style="border-radius: 6px; border: 4px solid rgb(255, 255, 255); box-shadow: rgba(0, 0, 0, 0.1) 0px 2px 8px; max-width: 150px;" />
            </div>
        </div>
    </div>
</div>
